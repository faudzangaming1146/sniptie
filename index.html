<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sniptie - Chat Realtime</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- TailWind CSS untuk Tampilan Modern -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col font-sans">

  <!-- APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- SIDEBAR: DAFTAR TEMAN / USER -->
    <div id="sidebar" class="w-1/3 border-r border-slate-700 flex flex-col bg-slate-800">
      <!-- User Header -->
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="my-avatar" class="w-10 h-10 rounded-full bg-slate-600" src="" alt="Avatar">
          <div>
            <h2 id="my-name" class="font-bold text-sm">Loading...</h2>
            <p id="my-email" class="text-xs text-slate-400"></p>
          </div>
        </div>
        <button onclick="logout()" class="text-xs bg-red-600/80 hover:bg-red-600 px-3 py-1.5 rounded transition">Logout</button>
      </div>

      <!-- User List (Tambah Teman & Chat) -->
      <div class="p-3 bg-slate-800/50 border-b border-slate-700">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Daftar Pengguna / Teman</h3>
      </div>
      <div id="users-list" class="flex-1 overflow-y-auto divide-y divide-slate-700/50">
        <!-- List pengguna akan dimuat secara dinamis -->
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="flex-1 flex flex-col bg-slate-900">
      <!-- Active Chat Header -->
      <div id="chat-header" class="p-4 border-b border-slate-700 bg-slate-800 flex items-center gap-3">
        <div id="active-user-avatar" class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-slate-400">?</div>
        <div>
          <h3 id="active-user-name" class="font-bold text-base">Pilih teman untuk memulai chat</h3>
          <p id="active-user-status" class="text-xs text-slate-400"></p>
        </div>
      </div>

      <!-- Messages Box -->
      <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
        <div class="text-center text-slate-500 my-auto text-sm">Belum ada obrolan yang dipilih.</div>
      </div>

      <!-- Input Form -->
      <form id="message-form" onsubmit="sendMessage(event)" class="p-4 border-t border-slate-700 bg-slate-800 flex gap-2">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Tulis pesan..." 
          disabled 
          class="flex-1 bg-slate-700 text-white placeholder-slate-400 px-4 py-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50"
        >
        <button 
          type="submit" 
          id="send-btn" 
          disabled 
          class="bg-purple-600 hover:bg-purple-500 text-white font-medium px-5 py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Kirim
        </button>
      </form>
    </div>

  </div>

  <!-- LOGIN MODAL (Tampil jika belum login) -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 w-full max-w-md text-center shadow-2xl">
      <h1 class="text-3xl font-extrabold text-purple-400 mb-2">Sniptie</h1>
      <p class="text-slate-400 mb-6 text-sm">Masuk untuk mengobrol secara realtime dengan teman kamu.</p>
      <button 
        onclick="loginWithGoogle()" 
        class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition shadow-md"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Lanjutkan dengan Google
      </button>
    </div>
  </div>

  <script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://mnixgvsglsviefzvimnd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ybxqRacRWJmy5ti4wnQsLA_Yrxcr8vp'; // Ganti dengan anon/publishable key lengkap kamu

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let selectedUser = null;

    // --- INIT APP ---
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        document.getElementById('login-modal').classList.add('hidden');
        await saveUserProfile(currentUser);
        setupUserDataUI();
        await loadUsers();
        setupRealtimeSubscriptions();
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    }

    // --- AUTHENTICATION ---
    async function loginWithGoogle() {
      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.reload();
    }

    // --- SAVE PROFILE TO SUPABASE ---
    async function saveUserProfile(user) {
      const profileData = {
        id: user.id,
        google_email: user.email,
        google_name: user.user_metadata.full_name || user.email.split('@')[0],
        avatar_url: user.user_metadata.avatar_url || ''
      };

      await supabase.from('profiles').upsert(profileData);
    }

    function setupUserDataUI() {
      document.getElementById('my-name').textContent = currentUser.user_metadata.full_name || currentUser.email;
      document.getElementById('my-email').textContent = currentUser.email;
      document.getElementById('my-avatar').src = currentUser.user_metadata.avatar_url || 'https://via.placeholder.com/40';
    }

    // --- LOAD USERS LIST ---
    async function loadUsers() {
      const { data: users, error } = await supabase
        .from('profiles')
        .select('*')
        .neq('id', currentUser.id); // Jangan tampilkan diri sendiri

      if (error) return console.error('Error loading users:', error);

      const listEl = document.getElementById('users-list');
      listEl.innerHTML = '';

      if (!users || users.length === 0) {
        listEl.innerHTML = '<div class="p-4 text-xs text-slate-500 text-center">Belum ada pengguna lain terdaftar.</div>';
        return;
      }

      users.forEach(u => {
        const item = document.createElement('div');
        item.className = `p-3 flex items-center gap-3 hover:bg-slate-700/50 cursor-pointer transition ${selectedUser?.id === u.id ? 'bg-slate-700' : ''}`;
        item.onclick = () => selectUser(u);
        
        item.innerHTML = `
          <img class="w-9 h-9 rounded-full bg-slate-600" src="${u.avatar_url || 'https://via.placeholder.com/40'}" alt="Avatar">
          <div class="flex-1 min-w-0">
            <h4 class="font-medium text-sm text-slate-200 truncate">${u.google_name || 'Pengguna'}</h4>
            <p class="text-xs text-slate-400 truncate">${u.google_email}</p>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // --- SELECT CHAT USER ---
    async function selectUser(user) {
      selectedUser = user;
      document.getElementById('active-user-name').textContent = user.google_name || user.google_email;
      document.getElementById('active-user-status').textContent = user.google_email;
      document.getElementById('active-user-avatar').innerHTML = `<img class="w-10 h-10 rounded-full" src="${user.avatar_url || 'https://via.placeholder.com/40'}">`;
      
      document.getElementById('message-input').disabled = false;
      document.getElementById('send-btn').disabled = false;

      await loadUsers(); // Highlight selected user
      await loadMessages();
    }

    // --- LOAD MESSAGES ---
    async function loadMessages() {
      if (!selectedUser) return;

      const { data: messages, error } = await supabase
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      if (error) return console.error('Error loading messages:', error);

      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      messages.forEach(m => renderSingleMessage(m));
      scrollToBottom();
    }

    // --- SEND MESSAGE ---
    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (!text || !selectedUser) return;

      input.value = '';

      const newMessage = {
        sender_id: currentUser.id,
        receiver_id: selectedUser.id,
        content: text
      };

      const { error } = await supabase.from('messages').insert([newMessage]);
      if (error) console.error('Gagal mengirim pesan:', error);
    }

    // --- RENDER SINGLE MESSAGE TO UI ---
    function renderSingleMessage(msg) {
      const container = document.getElementById('messages-container');
      const isMe = msg.sender_id === currentUser.id;

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

      msgDiv.innerHTML = `
        <div class="max-w-[70%] px-4 py-2.5 rounded-2xl text-sm ${isMe ? 'bg-purple-600 text-white rounded-br-none' : 'bg-slate-700 text-slate-100 rounded-bl-none'} shadow-md">
          <p class="break-words">${escapeHtml(msg.content)}</p>
        </div>
      `;

      container.appendChild(msgDiv);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // --- REALTIME SUBSCRIPTIONS (Sangat Penting!) ---
    function setupRealtimeSubscriptions() {
      // 1. Dengarkan Pesan Baru (Tanpa Reload)
      supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          const newMsg = payload.new;
          // Tampilkan jika pesan ini milik chat yang sedang aktif dibuka
          if (selectedUser && 
             ((newMsg.sender_id === currentUser.id && newMsg.receiver_id === selectedUser.id) ||
              (newMsg.sender_id === selectedUser.id && newMsg.receiver_id === currentUser.id))) {
            renderSingleMessage(newMsg);
          }
        })
        .subscribe();

      // 2. Dengarkan Pengguna Baru yang Mendaftar (Tanpa Reload)
      supabase
        .channel('public:profiles')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'profiles' }, () => {
          loadUsers();
        })
        .subscribe();
    }

    // Jalankan Aplikasi
    init();
  </script>
</body>
</html>
